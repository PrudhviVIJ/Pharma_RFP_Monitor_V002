name: Daily Pharma RFP Monitor

on:
  schedule:
    - cron: "0 20 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-pharma-rfp-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Check out the repository
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Restore monitor state
        id: restore-monitor-state
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            output/monitor_state.json
            output/.monitor-state-cache-v3
          key: pharma-rfp-monitor-state-v3-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            pharma-rfp-monitor-state-v3-${{ github.ref_name }}-

      # 3. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 4. Install the browser required by Playwright
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # 5. Configure Google Sheets credentials
      - name: Configure Google Sheets credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT" ]; then
            echo "::error::Missing GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT secret"
            exit 1
          fi

          mkdir -p credentials

          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT" \
            > credentials/google_service_account.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("credentials/google_service_account.json")

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(
                  "Google service-account credentials are not valid JSON."
              ) from exc

          if not data.get("client_email") or not data.get("private_key"):
              raise SystemExit(
                  "Credentials must contain client_email and private_key."
              )

          print("Google Sheets credentials validated.")
          PY

      # 6. Validate persistent monitor state
      - name: Prepare monitor state
        run: |
          mkdir -p output logs

          if [ ! -f output/.monitor-state-cache-v3 ]; then
            echo "No state in the new cache namespace; starting a fresh scrape history."
            printf '{}\n' > output/monitor_state.json
            rm -f output/rfp_grant_matches.csv \
              output/last_alert_candidates.csv \
              output/last_run_report.csv \
              output/opportunities.md \
              output/gemini_discovered_urls.json \
              output/health.json
          fi

          touch output/.monitor-state-cache-v3

          if [ ! -f output/monitor_state.json ]; then
            echo "::warning::Monitor state file not found. Initializing new state."
            printf '{}\n' > output/monitor_state.json
          fi

          if [ ! -s output/monitor_state.json ]; then
            echo "::error::Monitor state file is empty."
            exit 1
          fi

          if ! python -m json.tool output/monitor_state.json > /dev/null; then
            echo "::error::Monitor state contains invalid JSON."
            exit 1
          fi

          echo "Monitor state validated."

      # 7. Validate Google Sheets configuration
      - name: Diagnose Google Sheets configuration
        env:
          SHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          SHEET_NAME: ${{ vars.GOOGLE_SHEETS_WORKSHEET || 'Pharma RFP Monitor' }}
          CREDENTIALS_PATH: credentials/google_service_account.json
        run: |
          if [ -z "$SHEET_ID" ]; then
            echo "::error::Missing GOOGLE_SHEETS_SPREADSHEET_ID secret"
            exit 1
          fi

          if [ ! -s "$CREDENTIALS_PATH" ]; then
            echo "::error::Google Sheets credentials file is missing"
            exit 1
          fi

          echo "Google Sheets spreadsheet ID is configured."
          echo "Worksheet: $SHEET_NAME"
          echo "Credentials file is present."

      - name: Validate optional email configuration
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          if [ -n "$SMTP_HOST" ] && { [ -z "$ALERT_FROM" ] || [ -z "$ALERT_TO" ]; }; then
            echo "::error::SMTP_HOST is configured but ALERT_FROM or ALERT_TO is missing"
            exit 1
          fi
          if [ -n "$ALERT_FROM" ] && [ -z "$SMTP_HOST" ]; then
            echo "::error::ALERT_FROM is configured but SMTP_HOST is missing"
            exit 1
          fi
          if [ -n "$SMTP_HOST" ] && [ "$SMTP_USE_TLS" != "true" ] && [ "$SMTP_USE_TLS" != "1" ] && [ "$SMTP_HOST" != "localhost" ] && [ "$SMTP_HOST" != "127.0.0.1" ]; then
            echo "::error::SMTP_USE_TLS must be true for non-local SMTP servers"
            exit 1
          fi
          echo "Optional email configuration is consistent."

      # 8. Run the Pharma RFP Monitor
      - name: Run Pharma RFP Monitor
        env:
          INPUT_XLSX: RFP Scrape Pharma URLs.xlsx
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_WORKSHEET: ${{ vars.GOOGLE_SHEETS_WORKSHEET || 'Pharma RFP Monitor' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: credentials/google_service_account.json

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GEMINI_DISCOVERY: ${{ vars.GEMINI_DISCOVERY || 'false' }}
          GEMINI_REVIEW: ${{ vars.GEMINI_REVIEW || 'true' }}

          POSTGRES_ENABLED: ${{ vars.POSTGRES_ENABLED || 'false' }}
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}

          PYTHONUNBUFFERED: "1"
        run: |
          python main.py

      # 9. Verify generated outputs
      - name: Verify monitor outputs
        if: always()
        run: |
          echo "Output directory:"
          ls -la output || true

          if [ -s output/monitor_state.json ]; then
            python -m json.tool output/monitor_state.json > /dev/null
            echo "Monitor state is valid JSON."
          else
            echo "::error::Monitor state file is missing or empty."
            exit 1
          fi

          if [ -f output/rfp_grant_matches.csv ]; then
            echo "Current matches report exists."
          fi

          if [ -f output/last_run_report.csv ]; then
            echo "Run report exists."
          fi

          if [ -s output/health.json ]; then
            python -m json.tool output/health.json > /dev/null
            echo "Health report is valid JSON."
          else
            echo "::error::Health report is missing or empty."
            exit 1
          fi

      # 10. Persist state in the Actions cache, not in the production branch.
      - name: Save monitor state
        if: success() && hashFiles('output/monitor_state.json') != ''
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            output/monitor_state.json
            output/.monitor-state-cache-v3
          key: pharma-rfp-monitor-state-v3-${{ github.ref_name }}-${{ github.run_id }}

      # 11. Upload logs and reports even when earlier steps fail
      - name: Upload run logs and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pharma-rfp-monitor-logs
          path: |
            logs/
            output/last_run_report.csv
            output/last_alert_candidates.csv
            output/gemini_discovered_urls.json
            output/rfp_grant_matches.csv
            output/health.json
            output/opportunities.md
          if-no-files-found: ignore
          retention-days: 30
